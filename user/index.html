<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Civic Reporting System</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind config for custom theme -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["system-ui", "Inter", "ui-sans-serif", "sans-serif"],
            },
            colors: {
              primary: {
                50: "#EEF2FF",
                100: "#E0EAFF",
                500: "#4F46E5",
                600: "#4338CA",
                700: "#3730A3",
              },
              accent: {
                500: "#06B6D4",
                600: "#0891B2",
              },
            },
            boxShadow: {
              soft: "0 18px 45px rgba(15, 23, 42, 0.25)",
            },
            cursor: {
              "zoom-in": "zoom-in",
            },
            keyframes: {
              "slide-up": {
                "0%": { transform: "translateY(100%)", opacity: "0" },
                "100%": { transform: "translateY(0)", opacity: "1" },
              },
            },
            animation: {
              "slide-up": "slide-up 0.4s ease-out",
            },
          },
        },
      };
    </script>

    <!-- React 18 UMD -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  </head>
  <body
    class="min-h-screen bg-slate-950 bg-[radial-gradient(circle_at_top,_#1d4ed8_0,_#020617_45%,_#020617_100%)] text-slate-100 antialiased"
  >
    <!-- Subtle grid background overlay -->
    <div
      class="pointer-events-none fixed inset-0 opacity-[0.06] bg-[radial-gradient(circle,_#ffffff_1px,_transparent_1px)] [background-size:22px_22px]"
    ></div>

    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = window.React;
      const { createRoot } = window.ReactDOM;

      const issueTypes = [
        { value: "garbage", label: "Garbage", color: "bg-yellow-500" },
        {
          value: "streetlights",
          label: "Street Lights",
          color: "bg-amber-500",
        },
        { value: "waterleak", label: "Water Leak", color: "bg-sky-500" },
        { value: "sewage", label: "Sewage", color: "bg-emerald-600" },
        { value: "pothole", label: "Pothole", color: "bg-rose-600" },
      ];

      const statusFilters = [
        { value: "all", label: "All" },
        { value: "pending", label: "Pending" },
        { value: "accepted", label: "Accepted" },
        { value: "completed", label: "Completed" },
        { value: "rejected", label: "Rejected" },
      ];

      function getIssueConfig(type) {
        return issueTypes.find((t) => t.value === type) || issueTypes[0];
      }

      function Footer() {
        return (
          <footer className="mt-auto border-t border-white/10 bg-slate-950/80 backdrop-blur">
            <div className="mx-auto max-w-7xl px-4 py-4 flex items-center justify-center text-[11px] text-slate-400">
              <span className="text-center">
                © {new Date().getFullYear()} Smart Civic Reporting System. All
                rights reserved.
              </span>
            </div>
          </footer>
        );
      }

      // ── Image Modal Component ───────────────────────────────────────────────
      function ImageModal({ src, alt, onClose }) {
        if (!src) return null;

        return (
          <div
            className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-sm p-4"
            onClick={onClose}
          >
            <div className="relative max-w-5xl max-h-[90vh] w-full h-full flex items-center justify-center">
              <button
                className="absolute top-4 right-4 z-10 text-white/80 hover:text-white bg-black/40 hover:bg-black/60 rounded-full p-2 transition"
                onClick={onClose}
              >
                <svg
                  className="w-7 h-7"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    strokeWidth={2}
                    d="M6 18L18 6M6 6l12 12"
                  />
                </svg>
              </button>

              <img
                src={src}
                alt={alt || "Enlarged image"}
                className="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl border border-white/10"
                onClick={(e) => e.stopPropagation()}
              />
            </div>
          </div>
        );
      }

      function Toast({ message, type = "success", onClose }) {
        if (!message) return null;

        const bgColor =
          type === "success"
            ? "bg-emerald-600/90 border-emerald-500"
            : "bg-rose-600/90 border-rose-500";

        useEffect(() => {
          const timer = setTimeout(() => onClose(), 4000); // auto-dismiss after 4 seconds
          return () => clearTimeout(timer);
        }, [onClose]);

        return (
          <div className="fixed bottom-6 right-6 z-50 max-w-sm animate-slide-up">
            <div
              className={`flex items-center gap-3 rounded-xl border px-5 py-4 text-sm font-medium text-white shadow-lg backdrop-blur-md ${bgColor}`}
            >
              {/* Icon */}
              {type === "success" ? (
                <svg
                  className="h-6 w-6 flex-shrink-0"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    strokeWidth={2}
                    d="M5 13l4 4L19 7"
                  />
                </svg>
              ) : (
                <svg
                  className="h-6 w-6 flex-shrink-0"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    strokeWidth={2}
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                  />
                </svg>
              )}

              <span>{message}</span>

              {/* Close button */}
              <button
                onClick={onClose}
                className="ml-auto text-white/70 hover:text-white"
              >
                <svg
                  className="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    strokeWidth={2}
                    d="M6 18L18 6M6 6l12 12"
                  />
                </svg>
              </button>
            </div>
          </div>
        );
      }

      function App() {
        const [user, setUser] = useState(null);
        const [page, setPage] = useState("home");
        const [requests, setRequests] = useState([]);
        const [municipalities, setMunicipalities] = useState([]);
        const [loadingMunicipalities, setLoadingMunicipalities] =
          useState(true);
        const [location, setLocation] = useState({ lat: null, lng: null });
        const [locationError, setLocationError] = useState("");

        // Modal state
        const [modalImage, setModalImage] = useState(null);
        const [isSubmitting, setIsSubmitting] = useState(false);
        const [isFeedbackSubmitting, setIsFeedbackSubmitting] = useState(false);
        // Auth error & loading states
        const [loginError, setLoginError] = useState("");
        const [isLoggingIn, setIsLoggingIn] = useState(false);
        const [registerError, setRegisterError] = useState("");
        const [isRegistering, setIsRegistering] = useState(false);
        // Toast state
        const [toast, setToast] = useState(null); // { message, type: 'success' | 'error' } or null

        const [statusFilter, setStatusFilter] = useState("all");
        const [issueFilter, setIssueFilter] = useState("all");
        const [sortOrder, setSortOrder] = useState("newest"); // 'newest' | 'oldest'

        // Profile states
        const [profileModalOpen, setProfileModalOpen] = useState(false);
        const [profileData, setProfileData] = useState(null);
        const [profileLoading, setProfileLoading] = useState(false);
        const [profileTab, setProfileTab] = useState("overview"); // 'overview' | 'security'
        const [passwordForm, setPasswordForm] = useState({ currentPassword: "", newPassword: "", confirmPassword: "" });
        const [passwordSubmitting, setPasswordSubmitting] = useState(false);

        // Modal handlers
        const openImageModal = (src, alt = "") => {
          setModalImage({ src, alt });
        };

        const closeImageModal = () => {
          setModalImage(null);
        };

        const showToast = (message, type = "success") => {
          setToast({ message, type });
        };

        const hideToast = () => {
          setToast(null);
        };

        // Get user location
        useEffect(() => {
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                setLocation({
                  lat: pos.coords.latitude,
                  lng: pos.coords.longitude,
                });
              },
              () => setLocationError("Location access denied or unavailable"),
              { enableHighAccuracy: true, timeout: 8000 },
            );
          } else {
            setLocationError("Geolocation is not supported by this browser");
          }
        }, []);

        // Load municipalities
        useEffect(() => {
          fetch("/api/municipalities")
            .then((res) => (res.ok ? res.json() : []))
            .then((data) => setMunicipalities(data))
            .catch(() => setMunicipalities([]))
            .finally(() => setLoadingMunicipalities(false));
        }, []);

        // Check login + load requests
        useEffect(() => {
          fetch("/api/me")
            .then((res) => res.json())
            .then((data) => {
              if (data.user) {
                setUser(data.user);
                setPage("dashboard");
                loadRequests();
              }
            })
            .catch(() => {});
        }, []);

        const loadRequests = () => {
          fetch("/api/requests")
            .then((res) => (res.ok ? res.json() : []))
            .then(setRequests)
            .catch(() => setRequests([]));
        };

        const safeFetch = async (url, options = {}) => {
          try {
            const res = await fetch(url, options);
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              //alert(err.error || "Request failed");
              showToast(err.error || "Request failed", "error");
              return null;
            }
            return await res.json().catch(() => null);
          } catch (err) {
            alert("Network error: " + err.message);
            return null;
          }
        };

        const handleLogin = async (e) => {
          e.preventDefault();
          setLoginError("");
          setIsLoggingIn(true);
          const form = e.target;
          const username = form.username.value.trim();
          const password = form.password.value;

          if (!username || !password) {
            const msg = "Please enter both username and password.";
            setLoginError(msg);
            showToast(msg, "error");
            setIsLoggingIn(false);
            return;
          }

          try {
            const res = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
            });
            const data = await res.json().catch(() => ({}));

            if (!res.ok) {
              const errMsg = data.error || "Login failed. Please check your credentials.";
              setLoginError(errMsg);
              showToast(errMsg, "error");
              return;
            }

            if (data?.user) {
              setLoginError("");
              setUser(data.user);
              setPage("dashboard");
              loadRequests();
            }
          } catch (err) {
            const netErr = "Network error: Unable to reach the server. Please try again.";
            setLoginError(netErr);
            showToast(netErr, "error");
          } finally {
            setIsLoggingIn(false);
          }
        };

        const handleRegister = async (e) => {
          e.preventDefault();
          setRegisterError("");
          setIsRegistering(true);
          const form = e.target;

          if (form.password.value !== form.confirm.value) {
            const msg = "Passwords do not match. Please verify and re-enter.";
            setRegisterError(msg);
            showToast(msg, "error");
            setIsRegistering(false);
            return;
          }

          try {
            const res = await fetch("/api/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: form.username.value.trim(),
                email: form.email.value.trim() || null,
                password: form.password.value,
                role: form.role.value,
                municipalityId: form.municipalityId.value,
              }),
            });
            const data = await res.json().catch(() => ({}));

            if (!res.ok) {
              const errMsg = data.error || "Registration failed. Please try again.";
              setRegisterError(errMsg);
              showToast(errMsg, "error");
              return;
            }

            if (data?.success) {
              showToast(data.message || "Registration successful! Please login.", "success");
              setLoginError("");
              setRegisterError("");
              setPage("home");
            }
          } catch (err) {
            const netErr = "Network error: Unable to complete registration.";
            setRegisterError(netErr);
            showToast(netErr, "error");
          } finally {
            setIsRegistering(false);
          }
        };

        const handleReport = async (e) => {
          e.preventDefault();

          if (!location.lat || !location.lng) {
            showToast(
              "Location is required. Please allow location access.",
              "error",
            );
            return;
          }

          if (isSubmitting) return;

          if (!confirm("Are you sure you want to submit this report?")) {
            return;
          }

          setIsSubmitting(true);

          try {
            const form = e.target;
            const fd = new FormData(form);
            fd.append("latitude", location.lat);
            fd.append("longitude", location.lng);

            const data = await safeFetch("/api/report", {
              method: "POST",
              body: fd,
            });

            if (data) {
              if (data.success === true) {
                showToast(
                  data.message || "Report submitted successfully!",
                  "success",
                );
                loadRequests();
                form.reset();
              } else {
                // Show detailed message from server (low confidence, etc.)
                showToast(
                  data.message || "Failed to submit report. Please try again.",
                  "error",
                );
              }
            }
          } catch (err) {
            showToast("Network error while submitting report", "error");
          } finally {
            setIsSubmitting(false);
          }
        };

        const handleComplete = (id) => {
          const input = document.createElement("input");
          input.type = "file";
          input.accept = "image/*";
          input.onchange = async (e) => {
            if (!e.target.files?.[0]) return;
            const fd = new FormData();
            fd.append("afterPhoto", e.target.files[0]);

            await safeFetch(`/api/complete/${id}`, {
              method: "POST",
              body: fd,
            });
            loadRequests();
          };
          input.click();
        };

        const handleAction = async (id, action, value) => {
          const endpoint =
            action === "review" ? `/api/review/${id}` : `/api/feedback/${id}`;

          let body;

          if (action === "review") {
            if (value === "rejected") {
              const reason = prompt("Please enter reason for rejection");
              if (!reason || !reason.trim()) {
                alert("Reason is required to reject this issue.");
                return;
              }
              body = { status: "rejected", reason: reason.trim() };
            } else {
              body = { status: "accepted", reason: null };
            }
          } else {
            // citizen feedback
            body = { feedback: value };
            setIsFeedbackSubmitting(true);
          }

          try {
            await safeFetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });

            await loadRequests();
          } finally {
            if (action === "feedback") {
              setIsFeedbackSubmitting(false);
            }
          }
        };

        const handleLogout = async () => {
          await safeFetch("/api/logout", { method: "POST" });
          setUser(null);
          setPage("home");
        };

        const loadProfile = async () => {
          setProfileLoading(true);
          try {
            const data = await safeFetch("/api/profile");
            if (data && data.user) {
              setProfileData(data);
            }
          } catch (err) {
            console.error("Profile load error:", err);
          } finally {
            setProfileLoading(false);
          }
        };

        const openProfileModal = () => {
          setProfileTab("overview");
          setPasswordForm({ currentPassword: "", newPassword: "", confirmPassword: "" });
          setProfileModalOpen(true);
          loadProfile();
        };

        const handlePasswordChange = async (e) => {
          e.preventDefault();
          if (passwordForm.newPassword !== passwordForm.confirmPassword) {
            showToast("New passwords do not match", "error");
            return;
          }
          if (passwordForm.newPassword.length < 6) {
            showToast("Password must be at least 6 characters", "error");
            return;
          }

          setPasswordSubmitting(true);
          try {
            const res = await safeFetch("/api/profile/change-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                currentPassword: passwordForm.currentPassword,
                newPassword: passwordForm.newPassword,
              }),
            });

            if (res?.success) {
              showToast(res.message || "Password updated successfully!", "success");
              setPasswordForm({ currentPassword: "", newPassword: "", confirmPassword: "" });
              setProfileTab("overview");
            }
          } catch (err) {
            showToast("Failed to update password", "error");
          } finally {
            setPasswordSubmitting(false);
          }
        };

        const muniRequests = useMemo(
          () =>
            requests.filter((r) => r.municipalityId === user?.municipalityId),
          [requests, user],
        );

        const filteredRequests = useMemo(
          () =>
            muniRequests.filter((r) => {
              const statusOk =
                statusFilter === "all"
                  ? true
                  : (r.status || "pending") === statusFilter;
              const issueOk =
                issueFilter === "all"
                  ? true
                  : (r.issue_type || r.issuetype) === issueFilter;
              return statusOk && issueOk;
            }),
          [muniRequests, statusFilter, issueFilter],
        );

        const displayedRequests = useMemo(() => {
          const copy = [...filteredRequests];
          // If we want oldest first → reverse the array
          if (sortOrder === "oldest") {
            copy.reverse();
          }
          return copy;
        }, [filteredRequests, sortOrder]);

        const analytics = useMemo(() => {
          const total = muniRequests.length;
          const completed = muniRequests.filter(
            (r) => r.status === "completed",
          ).length;
          const pending = muniRequests.filter(
            (r) => !r.status || r.status === "pending",
          ).length;
          const accepted = muniRequests.filter(
            (r) => r.status === "accepted",
          ).length;
          const rejected = muniRequests.filter(
            (r) => r.status === "rejected",
          ).length;

          const perType = {};
          issueTypes.forEach((t) => {
            perType[t.value] = muniRequests.filter(
              (r) => (r.issue_type || r.issuetype) === t.value,
            ).length;
          });

          return { total, completed, pending, accepted, rejected, perType };
        }, [muniRequests]);

        // ── PAGES ───────────────────────────────────────────────────────────────

        if (page === "home") {
          // ... (login page remains unchanged)
          return (
            <div className="flex flex-col min-h-screen">
              <div className="flex-1 flex items-center justify-center px-4">
                <div className="w-full max-w-5xl grid md:grid-cols-2 gap-10 items-center">
                  <div className="space-y-8">
                    <div className="flex items-center gap-4">
                      <img
                        src="/logo.png"
                        alt="Smart Civic Logo"
                        className="h-16 w-16 object-contain rounded-2xl shadow-xl border border-white/10 bg-white/5 p-1 backdrop-blur"
                      />
                      <div className="inline-flex items-center gap-3 rounded-full bg-white/5 px-4 py-1.5 border border-white/10 backdrop-blur">
                        <span className="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span className="text-xs uppercase tracking-[0.2em] text-slate-300">
                          CivicTech Platform
                        </span>
                      </div>
                    </div>
                    <div>
                      <h1 className="text-4xl md:text-5xl font-semibold tracking-tight text-white">
                        Smart Civic{" "}
                        <span className="text-accent-400">Reporting</span>{" "}
                        System
                      </h1>
                      <p className="mt-4 text-slate-300 leading-relaxed text-sm md:text-base">
                        A citizen-centric platform to capture urban issues with
                        geo-tagged evidence, streamline municipal workflows, and
                        measure resolution satisfaction.
                      </p>
                    </div>
                    <div className="grid grid-cols-3 gap-4 text-xs md:text-sm">
                      <div className="rounded-2xl border border-white/10 bg-white/5 backdrop-blur p-4">
                        <p className="text-slate-400">Real-time</p>
                        <p className="mt-1 text-lg font-semibold text-white">
                          Geo Reports
                        </p>
                      </div>
                      <div className="rounded-2xl border border-white/10 bg-white/5 backdrop-blur p-4">
                        <p className="text-slate-400">Role-based</p>
                        <p className="mt-1 text-lg font-semibold text-white">
                          Dashboards
                        </p>
                      </div>
                      <div className="rounded-2xl border border-white/10 bg-white/5 backdrop-blur p-4">
                        <p className="text-slate-400">Feedback</p>
                        <p className="mt-1 text-lg font-semibold text-white">
                          Analytics
                        </p>
                      </div>
                    </div>
                  </div>

                  <div className="relative">
                    <div className="absolute -inset-0.5 bg-gradient-to-tr from-primary-500 via-accent-500 to-emerald-500 opacity-60 blur-2xl"></div>
                    <div className="relative rounded-3xl border border-white/10 bg-slate-900/70 backdrop-blur-xl shadow-soft p-8">
                      <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-semibold text-white">
                          Sign in to Dashboard
                        </h2>
                        <span className="text-xs text-slate-400">
                          Municipality & Citizen
                        </span>
                      </div>

                      <div className="flex gap-2 mb-6 text-xs">
                        <button
                          type="button"
                          onClick={() => {
                            setPage("home");
                            setLoginError("");
                            setRegisterError("");
                          }}
                          className="flex-1 py-2 rounded-full bg-slate-800 text-slate-100 border border-white/10 font-medium"
                        >
                          Login
                        </button>
                        <button
                          type="button"
                          onClick={() => {
                            setPage("register");
                            setLoginError("");
                            setRegisterError("");
                          }}
                          className="flex-1 py-2 rounded-full bg-transparent text-slate-300 border border-transparent hover:border-white/20 hover:bg-white/5 transition"
                        >
                          Register
                        </button>
                      </div>

                      {loginError && (
                        <div className="mb-6 flex items-start gap-3 rounded-2xl border border-rose-500/40 bg-rose-500/15 p-4 text-xs text-rose-200 animate-slide-up shadow-lg">
                          <svg
                            className="h-5 w-5 flex-shrink-0 text-rose-400 mt-0.5"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                          >
                            <path
                              strokeLinecap="round"
                              strokeLinejoin="round"
                              strokeWidth={2}
                              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
                            />
                          </svg>
                          <div className="flex-1 leading-relaxed">
                            <span className="font-semibold text-rose-100 block mb-0.5">
                              Login Failed
                            </span>
                            <span>{loginError}</span>
                          </div>
                          <button
                            type="button"
                            onClick={() => setLoginError("")}
                            className="text-rose-400 hover:text-white transition text-base leading-none p-1"
                            title="Dismiss"
                          >
                            ×
                          </button>
                        </div>
                      )}

                      <form onSubmit={handleLogin} className="space-y-5">
                        <div className="space-y-2">
                          <label className="block text-xs font-medium text-slate-300">
                            Username

                      </span>

                      <button
                        onClick={() =>
                          setSortOrder((prev) =>
                            prev === "newest" ? "oldest" : "newest",
                          )
                        }
                        className="text-xs text-accent-400 hover:underline font-medium"
                      >
                        Sort by{" "}
                        {sortOrder === "newest"
                          ? "Oldest first"
                          : "Newest first"}
                      </button>
                    </div>
                  </div>
                  {displayedRequests.length === 0 ? (
                    <div className="mt-4 rounded-3xl border border-dashed border-slate-600/60 bg-slate-900/60 px-6 py-10 text-center">
                      <p className="text-sm text-slate-300">
                        No reports match the selected filters.
                      </p>
                    </div>
                  ) : (
                    <div className="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
                      {displayedRequests.map((r) => {
                        const issue = getIssueConfig(
                          r.issue_type || r.issuetype,
                        );
                        return (
                          <article
                            key={r.id}
                            className="overflow-hidden rounded-3xl border border-white/10 bg-slate-950/70 backdrop-blur-xl shadow-soft flex flex-col"
                          >
                            <div className="flex items-center justify-between px-4 py-3 border-b border-white/5 bg-slate-900/80">
                              <span
                                className={`inline-flex items-center rounded-full px-3 py-1 text-[11px] font-medium text-white ${issue.color}`}
                              >
                                {issue.label}
                              </span>
                              <span className="text-[11px] text-slate-300">
                                #{r.id}
                              </span>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 p-4">
                              <div>
                                <p className="text-[11px] font-medium text-slate-300 mb-1">
                                  Before
                                </p>
                                <img
                                  src={r.imagePath}
                                  alt={`Before - ${issue.label}`}
                                  loading="lazy"
                                  className="h-40 w-full rounded-2xl object-cover border border-white/10 cursor-zoom-in transition hover:opacity-90 hover:shadow-xl hover:scale-[1.02]"
                                  onClick={() =>
                                    openImageModal(
                                      r.imagePath,
                                      `Before photo - ${issue.label}`,
                                    )
                                  }
                                />
                              </div>

                              {r.afterImagePath && (
                                <div>
                                  <p className="text-[11px] font-medium text-slate-300 mb-1">
                                    After
                                  </p>
                                  <img
                                    src={r.afterImagePath}
                                    alt={`After - ${issue.label}`}
                                    loading="lazy"
                                    className="h-40 w-full rounded-2xl object-cover border border-emerald-500/40 cursor-zoom-in transition hover:opacity-90 hover:shadow-xl hover:scale-[1.02]"
                                    onClick={() =>
                                      openImageModal(
                                        r.afterImagePath,
                                        `After photo (resolved) - ${issue.label}`,
                                      )
                                    }
                                  />
                                </div>
                              )}
                            </div>

                            <div className="flex-1 px-5 pb-5">
                              <p className="text-xs text-slate-200 mb-3 line-clamp-3">
                                <span className="font-semibold text-slate-100 mr-1">
                                  Description:
                                </span>
                                {r.description || "No description provided"}
                              </p>

                              {r.latitude && r.longitude && (
                                <p className="mb-3 text-[11px] text-slate-300">
                                  <span className="font-medium text-slate-100">
                                    Location:
                                  </span>{" "}
                                  <a
                                    href={`https://maps.google.com/?q=${r.latitude},${r.longitude}`}
                                    target="_blank"
                                    className="text-accent-300 hover:underline"
                                  >
                                    View on Maps
                                  </a>
                                </p>
                              )}

                              <p className="text-[11px] text-slate-400 mt-2 mb-3">
                                Reported:{" "}
                                {new Date(r.createdAt).toLocaleString("en-IN", {
                                  day: "numeric",
                                  month: "short",
                                  year: "numeric",
                                  hour: "2-digit",
                                  minute: "2-digit",
                                })}
                              </p>

                              {/* AI Confidence Display */}
                              {r.modelResult !== null &&
                                r.modelResult !== undefined && (
                                  <div className="mt-2 mb-4 text-[11px] flex items-center gap-2 flex-wrap">
                                    <span className="font-medium text-slate-200">
                                      AI Confidence:
                                    </span>
                                    <span
                                      className={`font-semibold px-2.5 py-0.5 rounded-full text-xs ${
                                        Number(r.modelResult) >= 80
                                          ? "bg-emerald-600/90 text-white"
                                          : Number(r.modelResult) >= 60
                                            ? "bg-amber-600/80 text-white"
                                            : "bg-rose-600/80 text-white"
                                      }`}
                                    >
                                      {Number(r.modelResult).toFixed(1)}%
                                    </span>
                                    {Number(r.modelResult) < 60 && (
                                      <span className="text-[10px] text-rose-400 italic">
                                        (low confidence)
                                      </span>
                                    )}
                                  </div>
                                )}

                              {/* Reopen Reason (shows when issue was reopened due to unsatisfied feedback) */}
                              {r.last_reopen_reason &&
                                r.status === "pending" && (
                                  <p className="mt-2 text-[11px] text-amber-400 bg-amber-900/20 border border-amber-500/30 rounded-lg px-3 py-1">
                                    Reopened: {r.last_reopen_reason}
                                  </p>
                                )}

                              <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                                <div className="flex flex-col gap-1 text-[11px]">
                                  <div className="flex items-center gap-2">
                                    <span className="font-medium text-slate-100">
                                      Status:
                                    </span>
                                    <span
                                      className={`px-3 py-1 rounded-full text-[11px] font-semibold text-white ${
                                        r.status === "accepted"
                                          ? "bg-sky-500/90"
                                          : r.status === "rejected"
                                            ? "bg-rose-500/90"
                                            : r.status === "completed"
                                              ? "bg-violet-500/90"
                                              : "bg-amber-400/90"
                                      }`}
                                    >
                                      {(r.status || "pending").toUpperCase()}
                                    </span>
                                  </div>

                                  {r.status === "rejected" &&
                                    r.rejectReason && (
                                      <p className="mt-1 text-[11px] text-rose-400 bg-rose-500/10 border border-rose-500/30 rounded-lg px-2 py-1">
                                        Reason: {r.rejectReason}
                                      </p>
                                    )}
                                </div>

                                {r.feedback && (
                                  <div className="flex items-center gap-2 text-[11px]">
                                    <span className="font-medium text-slate-100">
                                      Feedback:
                                    </span>
                                    <span
                                      className={`px-3 py-1 rounded-full text-[11px] font-semibold text-white ${
                                        r.feedback === "satisfied"
                                          ? "bg-emerald-500/90"
                                          : "bg-orange-500/90"
                                      }`}
                                    >
                                      {r.feedback === "satisfied"
                                        ? "Satisfied"
                                        : "Unsatisfied"}
                                    </span>
                                  </div>
                                )}
                              </div>

                              {/* Municipality Actions */}
                              {user.role === "municipality" &&
                                r.status === "pending" && (
                                  <div className="mt-2 flex gap-2 text-xs">
                                    <button
                                      onClick={() =>
                                        handleAction(r.id, "review", "accepted")
                                      }
                                      className="flex-1 rounded-xl bg-sky-500/90 px-3 py-2 font-medium text-white hover:bg-sky-400 transition"
                                    >
                                      Accept
                                    </button>
                                    <button
                                      onClick={() =>
                                        handleAction(r.id, "review", "rejected")
                                      }
                                      className="flex-1 rounded-xl bg-rose-500/90 px-3 py-2 font-medium text-white hover:bg-rose-400 transition"
                                    >
                                      Reject
                                    </button>
                                  </div>
                                )}

                              {user.role === "municipality" &&
                                r.status === "accepted" && (
                                  <button
                                    onClick={() => handleComplete(r.id)}
                                    className="mt-3 w-full rounded-xl bg-violet-500/90 px-4 py-2.5 text-xs font-medium text-white hover:bg-violet-400 transition"
                                  >
                                    Mark Completed & Upload After Photo
                                  </button>
                                )}

                              {/* Citizen Feedback */}
                              {/* Citizen Feedback - Shown every time issue is completed & feedback not yet given */}
                              {user.role === "user" &&
                                r.status === "completed" &&
                                !r.feedback && (
                                  <div className="mt-3 p-3 bg-slate-800/50 rounded-xl border border-slate-700">
                                    <p className="text-xs text-slate-300 mb-2 text-center">
                                      How satisfied are you with the resolution?
                                    </p>
                                    <div className="flex gap-2 text-xs">
                                      <button
                                        onClick={() =>
                                          handleAction(
                                            r.id,
                                            "feedback",
                                            "satisfied",
                                          )
                                        }
                                        disabled={isFeedbackSubmitting}
                                        className={
                                          "flex-1 rounded-xl px-3 py-2 text-xs font-medium text-white transition " +
                                          (isFeedbackSubmitting
                                            ? "bg-gray-600 cursor-not-allowed opacity-70"
                                            : "bg-emerald-60080 hover:bg-emerald-500")
                                        }
                                      >
                                        {isFeedbackSubmitting
                                          ? "Submitting..."
                                          : "Satisfied"}
                                      </button>

                                      <button
                                        onClick={() =>
                                          handleAction(
                                            r.id,
                                            "feedback",
                                            "unsatisfied",
                                          )
                                        }
                                        disabled={isFeedbackSubmitting}
                                        className={
                                          "flex-1 rounded-xl px-3 py-2 text-xs font-medium text-white transition " +
                                          (isFeedbackSubmitting
                                            ? "bg-gray-600 cursor-not-allowed opacity-70"
                                            : "bg-orange-60080 hover:bg-orange-500")
                                        }
                                      >
                                        {isFeedbackSubmitting
                                          ? "Submitting..."
                                          : "Unsatisfied"}
                                      </button>
                                    </div>
                                  </div>
                                )}
                            </div>
                          </article>
                        );
                      })}
                    </div>
                  )}
                </section>
              </main>
              {toast && (
                <Toast
                  message={toast.message}
                  type={toast.type}
                  onClose={hideToast}
                />
              )}
            </div>

            {/* Image Modal */}
            {modalImage && (
              <ImageModal
                src={modalImage.src}
                alt={modalImage.alt}
                onClose={closeImageModal}
              />
            )}

            {/* Profile Modal */}
            {profileModalOpen && (
              <div 
                className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 animate-fade-in overflow-y-auto"
                onClick={() => setProfileModalOpen(false)}
              >
                <div 
                  className="relative w-full max-w-xl rounded-3xl border border-white/10 bg-slate-900/95 p-6 sm:p-8 shadow-2xl space-y-6 my-8"
                  onClick={(e) => e.stopPropagation()}
                >
                  {/* Close button */}
                  <button
                    onClick={() => setProfileModalOpen(false)}
                    className="absolute top-5 right-5 text-slate-400 hover:text-white rounded-full p-1.5 hover:bg-white/10 transition"
                  >
                    <svg className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>

                  {/* Profile Header */}
                  <div className="flex items-center gap-4 border-b border-white/10 pb-5">
                    <div className="h-16 w-16 rounded-2xl bg-gradient-to-tr from-primary-500 via-accent-500 to-emerald-500 flex items-center justify-center text-2xl font-bold text-white shadow-lg ring-4 ring-white/10 flex-shrink-0">
                      {user.username ? user.username.charAt(0).toUpperCase() : "U"}
                    </div>
                    <div>
                      <div className="flex flex-wrap items-center gap-2">
                        <h2 className="text-xl font-bold text-white">{user.username}</h2>
                        <span className={`px-2.5 py-0.5 rounded-full text-[11px] font-semibold uppercase tracking-wider ${
                          user.role === 'user' 
                            ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' 
                            : 'bg-accent-500/20 text-accent-300 border border-accent-500/30'
                        }`}>
                          {user.role === 'user' ? 'Citizen' : 'Municipal Official'}
                        </span>
                      </div>
                      <p className="text-xs text-slate-400 mt-1 flex items-center gap-1.5">
                        <svg className="h-3.5 w-3.5 text-accent-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        Jurisdiction: <span className="text-slate-200 font-medium">{user.municipalityName}</span>
                      </p>
                    </div>
                  </div>

                  {/* Tabs */}
                  <div className="flex gap-2 border-b border-white/10 pb-2">
                    <button
                      onClick={() => setProfileTab('overview')}
                      className={`px-4 py-2 rounded-xl text-xs font-semibold transition ${
                        profileTab === 'overview'
                          ? 'bg-accent-500 text-white shadow-md'
                          : 'text-slate-400 hover:text-white hover:bg-white/5'
                      }`}
                    >
                      Account Overview & Stats
                    </button>
                    <button
                      onClick={() => setProfileTab('security')}
                      className={`px-4 py-2 rounded-xl text-xs font-semibold transition ${
                        profileTab === 'security'
                          ? 'bg-accent-500 text-white shadow-md'
                          : 'text-slate-400 hover:text-white hover:bg-white/5'
                      }`}
                    >
                      Security & Password
                    </button>
                  </div>

                  {/* Tab 1: Overview */}
                  {profileTab === 'overview' && (
                    <div className="space-y-6">
                      {/* Personal Details Grid */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                        <div className="rounded-2xl border border-white/10 bg-white/5 p-3.5">
                          <p className="text-slate-400 text-[11px]">Email Address</p>
                          <p className="mt-1 text-white font-medium truncate">
                            {profileData?.user?.email || user.email || 'Not provided'}
                          </p>
                        </div>
                        <div className="rounded-2xl border border-white/10 bg-white/5 p-3.5">
                          <p className="text-slate-400 text-[11px]">Account Status</p>
                          <p className="mt-1 flex items-center gap-1.5 font-medium text-emerald-400">
                            <span className="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
                            Active
                          </p>
                        </div>
                        <div className="rounded-2xl border border-white/10 bg-white/5 p-3.5">
                          <p className="text-slate-400 text-[11px]">Assigned Municipality</p>
                          <p className="mt-1 text-white font-medium">
                            {user.municipalityName}
                          </p>
                        </div>
                        <div className="rounded-2xl border border-white/10 bg-white/5 p-3.5">
                          <p className="text-slate-400 text-[11px]">Member Since</p>
                          <p className="mt-1 text-white font-medium">
                            {profileData?.user?.createdAt 
                              ? new Date(profileData.user.createdAt).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })
                              : 'Active Member'}
                          </p>
                        </div>
                      </div>

                      {/* Performance & Activity Statistics */}
                      <div>
                        <h3 className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">
                          {user.role === 'user' ? 'Your Civic Contribution' : 'Jurisdiction Work Summary'}
                        </h3>

                        {profileLoading ? (
                          <div className="py-6 text-center text-xs text-slate-400">
                            <span className="inline-block h-4 w-4 rounded-full border-2 border-accent-400 border-t-transparent animate-spin mr-2"></span>
                            Loading statistics...
                          </div>
                        ) : user.role === 'user' ? (
                          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                            <div className="rounded-2xl border border-white/10 bg-white/5 p-3 text-center">
                              <p className="text-[10px] text-slate-400 uppercase">Total Reports</p>
                              <p className="text-xl font-bold text-white mt-1">{profileData?.stats?.totalReports ?? requests.length}</p>
                            </div>
                            <div className="rounded-2xl border border-emerald-500/20 bg-emerald-500/10 p-3 text-center">
                              <p className="text-[10px] text-emerald-300 uppercase">Completed</p>
                              <p className="text-xl font-bold text-emerald-400 mt-1">
                                {profileData?.stats?.completedReports ?? requests.filter(r => r.status === 'completed').length}
                              </p>
                            </div>
                            <div className="rounded-2xl border border-amber-500/20 bg-amber-500/10 p-3 text-center">
                              <p className="text-[10px] text-amber-300 uppercase">Pending</p>
                              <p className="text-xl font-bold text-amber-400 mt-1">
                                {profileData?.stats?.pendingReports ?? requests.filter(r => !r.status || r.status === 'pending' || r.status === 'accepted').length}
                              </p>
                            </div>
                            <div className="rounded-2xl border border-cyan-500/20 bg-cyan-500/10 p-3 text-center">
                              <p className="text-[10px] text-cyan-300 uppercase">Satisfied</p>
                              <p className="text-xl font-bold text-cyan-400 mt-1">
                                {profileData?.stats?.satisfiedFeedback ?? requests.filter(r => r.feedback === 'satisfied').length}
                              </p>
                            </div>
                          </div>
                        ) : (
                          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                            <div className="rounded-2xl border border-white/10 bg-white/5 p-3 text-center">
                              <p className="text-[10px] text-slate-400 uppercase">Jurisdiction Total</p>
                              <p className="text-xl font-bold text-white mt-1">{profileData?.stats?.totalJurisdictionReports ?? muniRequests.length}</p>
                            </div>
                            <div className="rounded-2xl border border-emerald-500/20 bg-emerald-500/10 p-3 text-center">
                              <p className="text-[10px] text-emerald-300 uppercase">Resolved</p>
                              <p className="text-xl font-bold text-emerald-400 mt-1">
                                {profileData?.stats?.completedReports ?? muniRequests.filter(r => r.status === 'completed').length}
                              </p>
                            </div>
                            <div className="rounded-2xl border border-amber-500/20 bg-amber-500/10 p-3 text-center">
                              <p className="text-[10px] text-amber-300 uppercase">Action Needed</p>
                              <p className="text-xl font-bold text-amber-400 mt-1">
                                {profileData?.stats?.pendingReports ?? muniRequests.filter(r => !r.status || r.status === 'pending').length}
                              </p>
                            </div>
                            <div className="rounded-2xl border border-primary-500/20 bg-primary-500/10 p-3 text-center">
                              <p className="text-[10px] text-primary-300 uppercase">Completed by Me</p>
                              <p className="text-xl font-bold text-primary-400 mt-1">{profileData?.stats?.myCompletions ?? 0}</p>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {/* Tab 2: Security / Change Password */}
                  {profileTab === 'security' && (
                    <form onSubmit={handlePasswordChange} className="space-y-4">
                      <div>
                        <label className="block text-xs font-medium text-slate-300 mb-1.5">
                          Current Password
                        </label>
                        <input
                          type="password"
                          required
                          value={passwordForm.currentPassword}
                          onChange={(e) => setPasswordForm(prev => ({ ...prev, currentPassword: e.target.value }))}
                          placeholder="••••••••"
                          className="w-full rounded-xl border border-white/10 bg-slate-800/60 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-accent-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-slate-300 mb-1.5">
                          New Password
                        </label>
                        <input
                          type="password"
                          required
                          value={passwordForm.newPassword}
                          onChange={(e) => setPasswordForm(prev => ({ ...prev, newPassword: e.target.value }))}
                          placeholder="Min. 6 characters"
                          className="w-full rounded-xl border border-white/10 bg-slate-800/60 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-accent-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-slate-300 mb-1.5">
                          Confirm New Password
                        </label>
                        <input
                          type="password"
                          required
                          value={passwordForm.confirmPassword}
                          onChange={(e) => setPasswordForm(prev => ({ ...prev, confirmPassword: e.target.value }))}
                          placeholder="Confirm new password"
                          className="w-full rounded-xl border border-white/10 bg-slate-800/60 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-accent-500"
                        />
                      </div>
                      <div className="pt-2">
                        <button
                          type="submit"
                          disabled={passwordSubmitting}
                          className="w-full rounded-xl bg-gradient-to-r from-primary-500 via-accent-500 to-emerald-500 py-3 text-sm font-semibold text-white shadow-lg hover:brightness-110 transition disabled:opacity-50"
                        >
                          {passwordSubmitting ? "Updating Password..." : "Save New Password"}
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              </div>
            )}

            <Footer />
          </div>
        );
      }

      const root = createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
